<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AI Clone Video Platform</title>
  <style>
    body { font-family: Arial; max-width: 900px; margin: 40px auto; }
    .card { border: 1px solid #ddd; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    input, textarea { width: 100%; padding: 8px; margin: 4px 0 12px; }
    button { padding: 8px 16px; cursor: pointer; }
    iframe { width: 100%; height: 260px; border: none; border-radius: 8px; }
  </style>

  <script src="https://www.paypal.com/sdk/js?client-id={{PAYPAL_CLIENT_ID}}&vault=true&intent=subscription"></script>
</head>
<body>

  <h1>AI Clone Video Platform</h1>

  <!-- REGISTER -->
  <div class="card">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="email" id="regEmail" placeholder="Email" required />
      <input type="password" id="regPassword" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>
  </div>

  <!-- LOGIN -->
  <div class="card">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="logEmail" placeholder="Email" required />
      <input type="password" id="logPassword" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </div>

  <!-- ACCOUNT -->
  <div class="card">
    <h2>Your Account</h2>
    <button id="refreshMe">Refresh</button>
    <pre id="meInfo">Not logged in.</pre>
  </div>

  <!-- LESSONS -->
  <div class="card">
    <h2>Lessons</h2>
    <button id="loadLessons">Load Lessons</button>
    <div id="lessonsContainer"></div>
  </div>

  <!-- GENERATOR -->
  <div class="card">
    <h2>AI Video Generator</h2>
    <form id="genForm">
      <input type="file" id="genImage" accept="image/*" required />
      <textarea id="genScript" placeholder="Enter script..." required></textarea>
      <input type="text" id="genLang" value="en" />
      <button type="submit">Generate</button>
    </form>
    <div id="status"></div>
    <div id="videoLink"></div>
  </div>

  <!-- PAYPAL -->
  <div class="card">
    <h2>Upgrade to Pro</h2>
    <div id="paypal-button-container"></div>
  </div>

<script>
let token = null;

async function authed(url, options = {}) {
  options.headers = options.headers || {};
  if (token) options.headers["Authorization"] = "Bearer " + token;
  const res = await fetch(url, options);
  if (!res.ok) throw new Error(await res.text());
  return res;
}

document.getElementById("registerForm").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData();
  fd.append("email", regEmail.value);
  fd.append("password", regPassword.value);
  const res = await fetch("/auth/register", { method: "POST", body: fd });
  const data = await res.json();
  token = data.token;
  alert("Registered");
});

document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData();
  fd.append("email", logEmail.value);
  fd.append("password", logPassword.value);
  const res = await fetch("/auth/login", { method: "POST", body: fd });
  const data = await res.json();
  token = data.token;
  alert("Logged in");
});

document.getElementById("refreshMe").addEventListener("click", async () => {
  const res = await authed("/me");
  meInfo.textContent = JSON.stringify(await res.json(), null, 2);
});

document.getElementById("loadLessons").addEventListener("click", async () => {
  const res = await authed("/lessons");
  const lessons = await res.json();
  lessonsContainer.innerHTML = "";
  lessons.forEach(l => {
    lessonsContainer.innerHTML += `
      <div class="card">
        <h3>${l.title}</h3>
        <p>${l.description}</p>
        <iframe src="${l.video_url}" allowfullscreen></iframe>
      </div>`;
  });
});

document.getElementById("genForm").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData();
  fd.append("image", genImage.files[0]);
  fd.append("script", genScript.value);
  fd.append("language", genLang.value);

  status.textContent = "Generating...";

  const res = await fetch("/generate", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token },
    body: fd
  });

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  videoLink.innerHTML = `<a href="${url}" download="video.mp4">Download Video</a>`;
  status.textContent = "Done!";
});

paypal.Buttons({
  createSubscription: (data, actions) =>
    actions.subscription.create({ plan_id: "{{PAYPAL_PLAN_ID}}" }),
  onApprove: async () => {
    await authed("/billing/upgrade", { method: "POST" });
    alert("Upgraded to Pro");
  }
}).render("#paypal-button-container");
</script>

</body>
</html>
